name: Publicar en GitHub Pages

# El sitio es estático: no hay build, se sube el repo tal cual.
#
# Publica SOLO desde `main`. Antes decía "la rama por defecto", que
# suena más listo y falla peor: cuando Pages se prende, GitHub le
# pone al environment `github-pages` una política de rama, y un job
# que la incumple no falla en un paso —falla en la puerta, en un
# segundo y sin un solo log— que es de las cosas más difíciles de
# diagnosticar que da Actions. Con el nombre puesto a mano, una rama
# de trabajo se salta el job limpiamente en vez de estrellarse.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez, y sin cancelar la que ya está en vuelo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Ojo, una sola vez: Pages tiene que estar prendido en modo
      # "GitHub Actions" (Settings → Pages → Build and deployment →
      # Source: GitHub Actions). El GITHUB_TOKEN del workflow no puede
      # prenderlo solo — la API contesta "Resource not accessible by
      # integration" — así que ese clic es a mano. Mientras no esté,
      # este paso falla con "Get Pages site failed / Not Found".
      - uses: actions/configure-pages@v5

      - name: Armar el sitio
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: despliegue
        uses: actions/deploy-pages@v4
