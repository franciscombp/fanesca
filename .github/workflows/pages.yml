name: Publicar en GitHub Pages

# El sitio es estático: no hay build, se sube el repo tal cual.
# Solo publica la rama por defecto — así una rama de trabajo puede
# empujarse sin salir al aire por accidente.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez, y sin cancelar la que ya está en vuelo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: prende Pages (modo "GitHub Actions") la primera vez,
      # para no tener que ir a Settings a mano.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Armar el sitio
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: despliegue
        uses: actions/deploy-pages@v4
